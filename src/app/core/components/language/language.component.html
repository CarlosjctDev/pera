<div
  role="radiogroup"
  aria-label="{{ 'settings.language' | t }}"
  [class]="
    compact()
      ? 'grid w-fit grid-cols-2 gap-1 rounded-xl bg-app-surface/80 p-1 ring-1 ring-inset ring-app-border backdrop-blur'
      : 'grid grid-cols-2 gap-1 rounded-xl bg-app-secondary p-1 ring-1 ring-inset ring-app-border'
  "
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="i18n.language() === option.value"
      [attr.aria-label]="option.label"
      (click)="setLanguage(option.value)"
      [class]="buttonClass(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
