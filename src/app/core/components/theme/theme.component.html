<div
  role="radiogroup"
  aria-label="{{ 'settings.theme.label' | t }}"
  [class]="
    compact()
      ? 'grid w-fit grid-cols-3 gap-1 rounded-xl bg-app-surface/80 p-1 ring-1 ring-inset ring-app-border backdrop-blur'
      : 'grid grid-cols-3 gap-1 rounded-xl bg-app-secondary p-1 ring-1 ring-inset ring-app-border'
  "
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="theme.preference() === option.value"
      [attr.aria-label]="option.label"
      (click)="theme.setPreference(option.value)"
      [class]="buttonClass(option.value)"
    >
      <app-icon [name]="option.icon" class="h-4 w-4" />

      <span [class]="compact() ? 'hidden md:inline' : ''">{{ option.label }}</span>
    </button>
  }
</div>
