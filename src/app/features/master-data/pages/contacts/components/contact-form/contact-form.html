<form (ngSubmit)="add()" class="space-y-4">
  @if (isPerson()) {
    <div class="space-y-2">
      <span class="text-sm font-medium">{{ 'contacts.gender' | t }}</span>
      <div class="flex flex-wrap gap-2">
        @for (gender of genders; track gender) {
          <button type="button" (click)="selectGender(gender)" [class]="genderClass(gender)">
            {{ genderLabel(gender) | t }}
          </button>
        }
      </div>
      @if (genderError()) {
        <p class="text-xs text-red-500" role="alert">{{ 'contacts.genderError' | t }}</p>
      }
    </div>
  }

  <div class="grid gap-4 sm:grid-cols-2">
    <div class="space-y-1">
      <label class="text-sm font-medium" for="contact-name">
        {{ 'contacts.name' | t }}
      </label>
      <input
        id="contact-name"
        name="contact-name"
        type="text"
        maxlength="60"
        autocomplete="off"
        class="w-full rounded-xl bg-app-secondary/50 px-3 py-2 text-sm text-app-fg ring-1 ring-inset ring-app-border transition focus:ring-2 focus:ring-app-primary focus:outline-none"
        [placeholder]="'contacts.namePlaceholder' | t"
        [attr.aria-invalid]="nameError() || nameDuplicate()"
        [ngModel]="name()"
        (ngModelChange)="name.set($event); nameError.set(false); nameDuplicate.set(false)"
      />
      @if (nameError()) {
        <p class="text-xs text-red-500" role="alert">{{ 'contacts.errors.name' | t }}</p>
      }
      @if (nameDuplicate()) {
        <p class="text-xs text-red-500" role="alert">
          {{ 'contacts.errors.duplicate' | t }}
        </p>
      }
    </div>

    <div class="space-y-1">
      <label class="text-sm font-medium" for="contact-relationship-type">
        {{ 'contacts.relationship' | t }}
      </label>
      <app-select
        id="contact-relationship-type"
        name="contact-relationship-type"
        [options]="relationshipOptions()"
        [placeholder]="'contacts.relationshipPlaceholder' | t"
        [ngModel]="relationshipTypeId()"
        (ngModelChange)="onRelationshipChange($event)"
      />
    </div>
  </div>

  <button
    class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-xl bg-app-primary px-4 py-2 text-sm font-semibold text-app-primary-fg transition hover:bg-app-primary-hover active:bg-app-primary-active disabled:cursor-not-allowed disabled:opacity-50"
    type="submit"
    [disabled]="saving()"
  >
    @if (saving()) {
      <app-icon name="loading" class="h-4 w-4 animate-spin" />
    } @else {
      <app-icon name="plus" class="h-4 w-4" />
    }

    {{ (saving() ? 'common.loading' : 'contacts.submit') | t }}
  </button>
</form>
