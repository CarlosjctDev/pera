<app-dialog-shell
  [title]="'settings.backups.dialogTitle' | t"
  [icon]="'save'"
  [maxWidth]="'min(92vw, 36rem)'"
>
  @if (allowSave) {
    <button
      type="button"
      (click)="onSave()"
      [disabled]="saving()"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-app-primary px-4 py-2.5 text-sm font-semibold text-app-primary-fg shadow-lg shadow-black/10 transition hover:bg-app-primary-hover focus:ring-2 focus:ring-app-primary focus:ring-offset-2 focus:ring-offset-app-surface focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
    >
      @if (saving()) {
        <app-icon name="loading" class="h-4 w-4 animate-spin" />
      } @else {
        <app-icon name="save" class="h-4 w-4" />
      }
      {{ (saving() ? 'settings.backups.saving' : 'settings.backups.save') | t }}
    </button>
  }

  @if (backups().length > 0) {
    <div class="mt-3 flex justify-end">
      <button
        type="button"
        (click)="onDeleteAll()"
        [disabled]="deletingAll()"
        class="inline-flex items-center gap-2 rounded-xl bg-red-500/10 px-3 py-2 text-xs font-semibold text-red-500 ring-1 ring-inset ring-red-500/20 transition hover:bg-red-500/20 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (deletingAll()) {
          <app-icon name="loading" class="h-3.5 w-3.5 animate-spin" />
        } @else {
          <app-icon name="trash" class="h-3.5 w-3.5" />
        }
        {{ 'settings.backups.deleteAll' | t }}
      </button>
    </div>
  }

  <div class="mt-4">
    <app-data-table
      [rows]="backups()"
      [columns]="columns()"
      [loading]="loading()"
      [emptyLabel]="'settings.backups.empty'"
      [maxHeight]="'16rem'"      
    />
  </div>

  <div class="mt-6 flex justify-end">
    <button
      type="button"
      (click)="close()"
      class="rounded-xl bg-app-secondary px-4 py-2.5 text-sm font-semibold text-app-secondary-fg ring-1 ring-inset ring-app-border transition hover:bg-app-secondary-hover hover:text-app-fg"
    >
      {{ 'common.close' | t }}
    </button>
  </div>

  <ng-template #dateCell let-entry>
    <span class="flex items-center gap-1.5 whitespace-nowrap">
      {{ (entry.date + 'T00:00:00') | i18nDate }}
      @if (entry.date === today) {
        <span class="rounded-full bg-app-primary/10 px-2 py-0.5 text-xs font-semibold text-app-primary">
          {{ 'settings.backups.today' | t }}
        </span>
      }
    </span>
  </ng-template>

  <ng-template #timeCell let-entry>
    <span class="whitespace-nowrap text-app-muted">{{ entry.savedAt | i18nDate: 'p' }}</span>
  </ng-template>

  <ng-template #actionsCell let-entry>
    <span class="flex items-center justify-end gap-2">
      <button
        type="button"
        (click)="onRestore(entry)"
        [disabled]="restoring() !== null || deleting() !== null"
        class="inline-flex items-center gap-2 rounded-xl bg-app-secondary px-3 py-1.5 text-xs font-semibold text-app-secondary-fg ring-1 ring-inset ring-app-border transition hover:bg-app-secondary-hover hover:text-app-fg disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (restoring() === entry.id) {
          <app-icon name="loading" class="h-3.5 w-3.5 animate-spin" />
        }
        {{ 'settings.backups.restore' | t }}
      </button>
      <button
        type="button"
        (click)="onDelete(entry)"
        [disabled]="deleting() !== null || restoring() !== null"
        [attr.aria-label]="'common.delete' | t"
        [tippy]="'common.delete' | t"
        class="inline-flex items-center justify-center rounded-xl bg-red-500/10 p-1.5 text-red-500 ring-1 ring-inset ring-red-500/20 transition hover:bg-red-500/20 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (deleting() === entry.id) {
          <app-icon name="loading" class="h-3.5 w-3.5 animate-spin" />
        } @else {
          <app-icon name="trash" class="h-3.5 w-3.5" />
        }
      </button>
    </span>
  </ng-template>
</app-dialog-shell>
