<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
  @for (type of types; track type) {
    <button
      type="button"
      (click)="select.emit(type)"
      class="group flex cursor-pointer flex-col gap-4 rounded-2xl bg-app-surface p-4 text-left shadow-sm ring-1 ring-app-border transition hover:ring-2 hover:ring-app-primary sm:p-5"
    >
      <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-app-secondary">
        <app-icon [name]="type" class="h-5 w-5" [class]="typeColor(type)" />
      </span>
      <span class="space-y-1">
        <span class="block text-base font-semibold">{{ typeLabel(type) | t }}</span>
        <span class="block text-sm leading-relaxed text-app-muted">
          {{ typeDescription(type) | t }}
        </span>
      </span>
      <span class="text-xs font-medium text-app-muted">
        {{ 'masterData.itemCount' | t: { count: typeCount(type) } }}
      </span>
      <span class="text-xs font-medium text-app-muted">
        {{ 'masterData.itemSize' | t: { size: typeSize(type) | bytes } }}
      </span>
    </button>
  }
</div>
