<app-dialog-shell
  [title]="attachment.name"
  icon="file"
  maxWidth="min(94vw, 760px)"
  [margin]="'0 auto'"
>
  <div #viewerHost [class]="hostClass()">
    <div class="mb-2 flex flex-wrap items-center justify-between gap-2 text-sm">
      <div class="flex min-w-0 items-center gap-2">
        <span
          class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-medium uppercase tracking-wide"
          [class]="
            isPdf()
              ? 'bg-red-500/10 text-red-600 dark:text-red-400'
              : 'bg-sky-500/10 text-sky-600 dark:text-sky-400'
          "
        >
          {{ (isPdf() ? 'attachments.pdf' : 'attachments.image') | t }}
        </span>
        <span
          class="truncate tabular-nums text-app-muted"
        >{{ attachment.size | bytes }}</span>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button
          type="button"
          (click)="download()"
          class="inline-flex shrink-0 cursor-pointer items-center gap-2 rounded-xl bg-app-secondary px-3 py-1.5 text-sm font-semibold text-app-secondary-fg transition hover:bg-app-secondary-hover"
        >
          <app-icon name="download" class="h-4 w-4" />
          {{ 'attachments.download' | t }}
        </button>
        <button
          type="button"
          (click)="toggleFullscreen()"
          class="inline-flex shrink-0 cursor-pointer items-center gap-2 rounded-xl bg-app-secondary px-3 py-1.5 text-sm font-semibold text-app-secondary-fg transition hover:bg-app-secondary-hover"
        >
          <app-icon
            [name]="isFullscreen() ? 'minimize' : 'maximize'"
            class="h-4 w-4"
          />
          {{ (isFullscreen() ? 'attachments.exitFullscreen' : 'attachments.fullscreen') | t }}
        </button>
      </div>
    </div>

    <div [class]="viewerBoxClass()">
      @if (isPdf()) {
        @if (pdfData() === undefined) {
          <div class="flex h-full items-center justify-center">
            <span class="text-sm text-app-muted">{{ 'common.loading' | t }}</span>
          </div>
        } @else {
          <ngx-extended-pdf-viewer
            class="block h-full"
            [src]="pdfData()"
            [height]="'100%'"
            [theme]="viewerTheme()"
            [filenameForDownload]="attachment.name"
            [showOpenFileButton]="false"
            [showDownloadButton]="false"
          ></ngx-extended-pdf-viewer>
        }
      } @else {
        <div class="flex h-full items-center justify-center p-4">
          <img
            [src]="previewImageUrl()"
            [alt]="attachment.name"
            class="max-h-full w-full rounded-lg object-contain"
          />
        </div>
      }
    </div>
  </div>
</app-dialog-shell>
